<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sys Lin – Interface Interactive n°1 – Stabilité et Bouclage</title>
<style>
:root{--bo:#d2701c;--paper:#f3f5f8;--card:#fff;--rule:#d9dee6;--ink:#1c2733;--muted:#5b6776;--loop:#1f5fae;--crit:#c0392b;--ok:#2f7d4f;--spec:#a86b00}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--loop);outline-offset:2px}
html,body{height:100%}
.app{display:grid;grid-template-columns:318px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;overflow:hidden}
aside,main{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
aside{background:#fff;border-right:1px solid var(--rule);padding:18px 18px 24px}
main{padding:0 0 40px}
.bilan{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.kv>div{display:flex;flex-direction:column;min-width:0}
.kv>div.w2{grid-column:span 2}
.kv span{color:var(--muted);font-size:11.5px}
.kv b{font-weight:600;font-size:13px}
.bilan .spec{margin:6px 0 0}
.brand{grid-column:1/-1;background:#fff;text-align:center;padding:12px 20px 10px;border-bottom:3px solid var(--loop)}
.brand h1{font-size:26px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.015em;color:#0f1c2e}
.brand .scope{margin:2px 0 0;font-size:13.5px;font-weight:600;color:var(--loop)}
.brand .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.brand .lin{margin:3px auto 0;font-size:12px;color:#8a5a00;background:#fdf3e1;display:inline-block;padding:1px 10px;border-radius:10px}
.brand .author{margin:2px 0 0;font-size:11.5px;color:#8a95a3;font-style:italic}
.brand h1,.brand .scope{transition:font-size .18s ease}
.brand .sub,.brand .lin,.brand .author{transition:opacity .18s ease}
.brand.compact{padding:5px 20px 4px;display:flex;justify-content:center;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand.compact h1{font-size:17px}
.brand.compact .scope{font-size:12px;margin:0}
.brand.compact .sub,.brand.compact .lin,.brand.compact .author{display:none}
.tdload{margin:0 0 10px;padding:7px 8px;background:#f5f8fc;border:1px solid var(--rule);border-radius:6px;font-size:12px;color:var(--muted)}
.tdload>div{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
.tdload button{background:#fff;border:1px solid #b9c8dc;border-radius:5px;padding:4px 6px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--loop);line-height:1.25}
.tdload button:hover{border-color:var(--loop);background:#eaf1fa}
.grp{border-top:1px solid var(--rule);padding:12px 0 6px}
.grp.first{border-top:0;padding-top:0}
.grp h2{font-size:13px;font-weight:700;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:11.5px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:10px}
.seg button:last-child:nth-child(odd){grid-column:1/-1}
.seg button{background:#fff;border:0;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.seg button span{font-size:11px;color:var(--muted)}
.seg button.on{background:var(--loop);color:#fff}.seg button.on span{color:#dbe6f5}
.ctl{margin:6px 0 9px}
.ctl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ctl-row .val{font-weight:700;display:flex;align-items:baseline;gap:4px}
.nf{font:inherit;font-weight:700;text-align:right;width:92px;border:1px solid transparent;border-bottom:1px dashed #c3cbd5;background:transparent;padding:1px 3px;border-radius:3px}
.nf:hover{border-color:#c3cbd5}
.nf:focus{border:1px solid var(--loop);background:#fff;outline:none}
.val .unit{font-weight:600;color:var(--muted)}
svg.cmd{margin-top:2px}
.hint{font-size:11.5px;color:var(--muted);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:#dde3ea;margin:6px 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ac,#1f5fae);box-shadow:0 1px 2px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ac,#1f5fae)}
.num{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.num label{color:var(--muted)}
.num input{width:96px;padding:4px 6px;border:1px solid var(--rule);border-radius:4px;font:inherit;text-align:right}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px;margin:4px 0 10px}
.presets button{background:#f7f9fb;border:1px solid var(--rule);border-radius:5px;padding:4px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;line-height:1.2}
.presets button b{font-size:13px}
.presets button span{font-size:11px}
.presets button i{font-style:normal;font-size:10.5px;color:var(--muted)}
.presets button:hover{border-color:var(--loop)}
.presets button.on{border-color:var(--loop);background:#eaf1fa}
.tg{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;position:relative;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{width:28px;height:16px;border-radius:8px;background:#cdd5de;position:relative;flex-shrink:0;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.tg input:checked+.sw{background:var(--ac)}
.tg input:checked+.sw::after{transform:translateX(12px)}
.tg input:focus-visible+.sw{outline:2px solid var(--loop);outline-offset:2px}
.tg.off{opacity:.45;cursor:default}
.btn{background:var(--loop);color:#fff;border:0;border-radius:5px;padding:6px 11px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--loop);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.snaps{list-style:none;margin:6px 0 0;padding:0}
.snaps li{display:flex;align-items:center;gap:7px;padding:3px 0}
.snaps li span:nth-child(2){flex:1}
.snaps li.dim{opacity:.45}
.checks{list-style:none;margin:8px 0 2px;padding:8px 10px;background:#fbf8f1;border:1px solid #efe3c8;border-radius:5px}
.checks li{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.sw2{width:18px;height:3px;border-radius:2px;display:inline-block}
dl.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 6px}
dl.ro dt{color:var(--muted)}
dl.ro dd{margin:0;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.pill.stable{background:#e4f2e9;color:var(--ok)}.pill.limite{background:#fdf1dc;color:#95600a}.pill.instable{background:#f9e1de;color:var(--crit)}
.chk{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;margin-left:4px}
.chk.yes{background:#e4f2e9;color:var(--ok)}.chk.no{background:#f9e1de;color:var(--crit)}
.voie{margin-bottom:30px}
.vh{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.vn{font-size:30px;line-height:1;font-weight:300;color:var(--loop);min-width:44px;text-align:right;padding-top:1px;white-space:nowrap}
.vh h2{font-size:17px;margin:0 0 3px;font-weight:650;letter-spacing:-.005em}
.lead{margin:0;color:var(--muted);max-width:78ch}
.fig{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 12px 6px}
.fig h3{font-size:13px;font-weight:600;margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
svg.plot text,svg.bd text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
svg.plot{width:100%;height:auto;display:block}
svg.pick{cursor:crosshair;touch-action:none}
.scrollx{overflow-x:auto}.scrollx svg{min-width:720px}
svg.bd{width:100%;height:auto;display:block}
.axisframe{display:grid;grid-template-columns:70px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px}
.yctl{display:flex;flex-direction:column;gap:14px;padding:4px 0 34px}
.axv{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
.axv input.vr{writing-mode:vertical-lr;direction:rtl;width:18px;height:auto;flex:1 1 0;min-height:50px;margin:5px 0;background:transparent;-webkit-appearance:none;appearance:none}
.axv input.vr::-webkit-slider-runnable-track{width:4px;background:#dde3ea;border-radius:2px}
.axv input.vr::-webkit-slider-thumb{margin-left:-6px}
.axv input.vr::-moz-range-track{width:4px;background:#dde3ea;border-radius:2px}
.axl{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-size:11px;color:var(--muted);text-align:center}
.axl b{color:var(--ink);font-size:12px}
.axh .axl{flex-direction:row;gap:6px;align-items:baseline}
.xctl{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:2px 10px 4px 40px}
.axh{display:flex;flex-direction:column}
.corner{display:flex;align-items:center;justify-content:center}
.btn.auto{padding:5px 4px;font-size:11px;width:70px}
.preading .lead2{margin:0 0 6px;color:var(--muted)}
.preading .lam{margin:0 0 8px;font-weight:600;color:var(--loop)}
.preading dl{margin:0 0 8px;display:grid;grid-template-columns:fit-content(40%) 1fr;gap:9px 14px}
.preading dt{font-weight:600}
.preading dd{margin:0}
.preading dd b{color:var(--loop)}
.preading .hid{color:#aab3be}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cmp>.bo{background:#fcf6ef}
.cmp>.bf{background:#f1f5fb;border-left:1px solid var(--rule)}
.colhead{padding:14px 18px 12px;border-top:4px solid}
.colhead.bo{border-top-color:var(--bo)}.colhead.bf{border-top-color:var(--loop)}
.colhead h2{margin:0;font-size:20px;font-weight:750;letter-spacing:-.01em}
.colhead.bo h2{color:#a9540f}.colhead.bf h2{color:var(--loop)}
.colhead p{margin:3px 0 0;color:var(--muted);max-width:62ch}
.sec{padding:18px 16px 8px}
.sec.span{grid-column:1/-1;background:var(--paper)}
.hbox{display:flex;gap:14px;align-items:center;background:#fef2f2;border:2px solid #dc2626;border-radius:6px;padding:7px 14px}
.hbox>div{min-width:0}
.hbox h3{margin:0;font-size:15.5px;font-weight:800;color:#b91c1c;letter-spacing:-.005em}
.hbox p{margin:2px 0 0;color:#7a3a3a;max-width:80ch;font-size:12.5px}
.hbox .vn{font-size:22px;line-height:1;font-weight:800;color:#dc2626;min-width:0;text-align:left;white-space:nowrap}
.cell{padding:10px 16px 12px;min-width:0}
.cell.last{padding-bottom:40px}
.cell.wide{grid-column:1/-1}
.sweepbtn{margin-left:auto;align-self:center;white-space:nowrap}
.sweepctl{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:0 8px 2px 70px}
.sweepctl .ctl{margin:2px 0 4px}
.cell.wide .vals{margin-top:6px}
.vh4{margin:2px 0 6px;font-size:13px;font-weight:650}
.fh{margin:0 0 4px;font-size:13px;font-weight:600}
.vals{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:9px 12px}
.cell>.fig+.vals{margin-top:8px}
.note,.note2{margin:8px 0 0}
.note{color:var(--ink);background:#fff;border-left:3px solid var(--bo);padding:6px 10px;border-radius:0 4px 4px 0}
.preading{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.tf{display:flex;flex-wrap:wrap;gap:10px 34px;align-items:center;padding:6px 4px 8px;font-size:14px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.frac span:first-child{border-bottom:1px solid currentColor;padding:0 4px}
.frac span:last-child{padding:0 4px}
.legend{margin:2px 0 6px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:22px;border-top:2px dotted;margin:0 5px 3px 14px;vertical-align:middle}
.routh{padding:4px 2px 8px}
.routh .eq{margin:0 0 8px}
.routh .warn{color:var(--crit)}
.routh table{border-collapse:collapse;margin:4px 0 8px}
.routh th,.routh td{border:1px solid var(--rule);padding:4px 12px;text-align:center}
.routh thead th{background:#f7f9fb;font-weight:600;font-size:12px}
.routh tbody th{background:#f7f9fb}
.routh tr.zero td{background:#fdf1dc}
.routh td.neg{color:var(--crit);font-weight:700}
.routh .concl{margin:0;max-width:78ch}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}
@media (max-width:1100px){.cmp{grid-template-columns:1fr}.cmp>.bf{border-left:0}.cell.empty,.sec.empty{display:none}}
@media (max-width:820px){html,body{height:auto}.app{grid-template-columns:1fr;grid-template-rows:auto;height:auto;overflow:visible}.brand h1{font-size:20px}aside,main{height:auto;overflow:visible}aside{border-right:0;border-bottom:1px solid var(--rule)}.bilan{position:static}.kv>div.w2{grid-column:auto}main{padding:16px 12px 40px}.vn{font-size:22px;min-width:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
